name: Update animation listings and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh listings before deployment
        type: boolean
        default: true
  schedule:
    # Every three hours at minute 17, including 14:17, 17:17 and 20:17 in Taiwan.
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: animation-pages
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: read
      pages: read
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || inputs.refresh
        with:
          python-version: '3.12'
      - name: Refresh public schedules
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          python -m pip install beautifulsoup4
          python scripts/update_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
